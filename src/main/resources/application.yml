spring:
  application:
    name: learning-platform
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/learning}
    username: ${DB_USERNAME:learning}
    password: ${DB_PASSWORD:learning}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
server:
  port: ${SERVER_PORT:8080}
